name: CI

# Läuft auf jedem Push, auch auf Dependabot-Branches. Merges auf main deployen per Dokploy,
# deshalb soll ein roter Lauf vor dem Merge auffallen.
on:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Lint, Typecheck, Tests
        run: bun run check
      - name: Build
        run: bun run build
